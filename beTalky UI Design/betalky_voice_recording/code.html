<!-- Interactive script for timer, pause and restart -->
<script>
    (() => {
      let seconds = 15;
      let isPaused = false;
      const maxSeconds = 59;

      const timerSecs = document.getElementById('timer-display-secs');
      const pauseBtn = document.getElementById('pause-btn');
      const pauseIcon = document.getElementById('pause-icon');
      const pauseLabel = document.getElementById('pause-label');
      const restartBtn = document.getElementById('restart-btn');
      const waveBars = document.querySelectorAll('.wave-bar');

      function updateDisplay() {
        if (timerSecs) {
          timerSecs.textContent = String(seconds).padStart(2, '0');
        }
      }

      const timerInterval = setInterval(() => {
        if (!isPaused && seconds < maxSeconds) {
          seconds++;
          updateDisplay();
        }
      }, 1000);

      if (pauseBtn) {
        pauseBtn.addEventListener('click', () => {
          isPaused = !isPaused;
          if (pauseIcon) {
            pauseIcon.textContent = isPaused ? 'play_arrow' : 'pause';
          }
          if (pauseLabel) {
            pauseLabel.textContent = isPaused ? 'Resume' : 'Pause';
          }
          waveBars.forEach(bar => {
            bar.style.animationPlayState = isPaused ? 'paused' : 'running';
          });
        });
      }

      if (restartBtn) {
        restartBtn.addEventListener('click', () => {
          seconds = 0;
          isPaused = false;
          if (pauseIcon) pauseIcon.textContent = 'pause';
          if (pauseLabel) pauseLabel.textContent = 'Pause';
          waveBars.forEach(bar => {
            bar.style.animationPlayState = 'running';
          });
          updateDisplay();
        });
      }

      updateDisplay();
    })();
  </script>
